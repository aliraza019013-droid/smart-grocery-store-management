<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440">
<rect width="1000" height="440" rx="18" fill="#fff"/><text x="35" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#173d6b">Application Feature Overview</text>
<rect x="35" y="72" width="455" height="80" rx="10" fill="#f5f8fc" stroke="#b8c9dc"/>
<text x="50" y="93" font-family="Arial" font-size="16" font-weight="700" fill="#173d6b">1. Add product</text>
<text x="50" y="114" font-family="Arial" font-size="11" fill="#333">add_product() | Input: ID, name, price, stock</text>
<text x="50" y="131" font-family="Arial" font-size="11" fill="#333">Rules: Unique ID; positive price | Output: Product saved</text>
<text x="50" y="145" font-family="Arial" font-size="10" fill="#6b3fa0">Concepts: dict, append, if</text><rect x="520" y="72" width="455" height="80" rx="10" fill="#f5f8fc" stroke="#b8c9dc"/>
<text x="535" y="93" font-family="Arial" font-size="16" font-weight="700" fill="#173d6b">2. View products</text>
<text x="535" y="114" font-family="Arial" font-size="11" fill="#333">view_products() | Input: Menu choice</text>
<text x="535" y="131" font-family="Arial" font-size="11" fill="#333">Rules: Handle empty inventory | Output: Product table</text>
<text x="535" y="145" font-family="Arial" font-size="10" fill="#6b3fa0">Concepts: for, dictionaries</text><rect x="35" y="166" width="455" height="80" rx="10" fill="#f5f8fc" stroke="#b8c9dc"/>
<text x="50" y="187" font-family="Arial" font-size="16" font-weight="700" fill="#173d6b">3. Search</text>
<text x="50" y="208" font-family="Arial" font-size="11" fill="#333">search_product() | Input: ID or name fragment</text>
<text x="50" y="225" font-family="Arial" font-size="11" fill="#333">Rules: Reject blank search | Output: Matching products</text>
<text x="50" y="239" font-family="Arial" font-size="10" fill="#6b3fa0">Concepts: list comprehension</text><rect x="520" y="166" width="455" height="80" rx="10" fill="#f5f8fc" stroke="#b8c9dc"/>
<text x="535" y="187" font-family="Arial" font-size="16" font-weight="700" fill="#173d6b">4. Update stock</text>
<text x="535" y="208" font-family="Arial" font-size="11" fill="#333">update_stock() | Input: ID, mode, quantity</text>
<text x="535" y="225" font-family="Arial" font-size="11" fill="#333">Rules: Product exists; valid quantity | Output: New stock balance</text>
<text x="535" y="239" font-family="Arial" font-size="10" fill="#6b3fa0">Concepts: if/elif, validation</text><rect x="35" y="260" width="455" height="80" rx="10" fill="#f5f8fc" stroke="#b8c9dc"/>
<text x="50" y="281" font-family="Arial" font-size="16" font-weight="700" fill="#173d6b">5. Process sale</text>
<text x="50" y="302" font-family="Arial" font-size="11" fill="#333">process_sale() | Input: ID, purchase quantity</text>
<text x="50" y="319" font-family="Arial" font-size="11" fill="#333">Rules: Exists; enough stock | Output: Receipt + sale record</text>
<text x="50" y="333" font-family="Arial" font-size="10" fill="#6b3fa0">Concepts: append, arithmetic</text><rect x="520" y="260" width="455" height="80" rx="10" fill="#f5f8fc" stroke="#b8c9dc"/>
<text x="535" y="281" font-family="Arial" font-size="16" font-weight="700" fill="#173d6b">6. Sales records</text>
<text x="535" y="302" font-family="Arial" font-size="11" fill="#333">view_sales() | Input: Menu choice</text>
<text x="535" y="319" font-family="Arial" font-size="11" fill="#333">Rules: Handle no sales | Output: Transaction list</text>
<text x="535" y="333" font-family="Arial" font-size="10" fill="#6b3fa0">Concepts: for, enumerate</text><rect x="35" y="354" width="455" height="80" rx="10" fill="#f5f8fc" stroke="#b8c9dc"/>
<text x="50" y="375" font-family="Arial" font-size="16" font-weight="700" fill="#173d6b">7. Store report</text>
<text x="50" y="396" font-family="Arial" font-size="11" fill="#333">generate_report() | Input: Menu choice</text>
<text x="50" y="413" font-family="Arial" font-size="11" fill="#333">Rules: Handle empty product list | Output: Inventory and sales stats</text>
<text x="50" y="427" font-family="Arial" font-size="10" fill="#6b3fa0">Concepts: len, sum, max, min</text></svg>